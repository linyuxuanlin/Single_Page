<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#0b0d10"/>
<title>驾驶实验室 · 倒车入库 v0.4</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#f7f8fa;background:#0b0d10}*{box-sizing:border-box}html,body,#app{width:100%;height:100%;margin:0;overflow:hidden}body{touch-action:none;overscroll-behavior:none}button{font:inherit}#scene{position:fixed;inset:0;width:100%;height:100%;display:block}.panel{backdrop-filter:blur(16px);background:rgba(10,12,15,.76);border:1px solid rgba(255,255,255,.1);border-radius:15px}.topbar{position:fixed;z-index:8;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.brand,.status{padding:9px 11px}.brand b,.status strong{display:block;font-size:13px}.brand small,.status small{font-size:10px;color:#9aa4b2}.status{text-align:right;max-width:55vw}.status.ok strong{color:#8af2af}.status.warn strong{color:#ffd978}.status.bad strong{color:#ff8c8c}.coach{position:fixed;z-index:8;left:10px;right:10px;top:78px;padding:9px 11px;pointer-events:none;font-size:12px}.coach b{margin-right:7px}.coach.ok b{color:#8af2af}.coach.info b{color:#91c7ff}.coach.warn b{color:#ffd978}.coach.danger b{color:#ff8c8c}.mirrors{position:fixed;z-index:6;left:50%;top:122px;transform:translateX(-50%);display:flex;gap:8px;pointer-events:none}.mirror{position:relative;width:min(29vw,210px);aspect-ratio:2.15/1;border:2px solid rgba(235,241,248,.58);border-radius:12px 12px 18px 18px;overflow:hidden;background:rgba(8,10,12,.38);box-shadow:0 7px 22px rgba(0,0,0,.28),inset 0 0 0 1px rgba(0,0,0,.7);transition:border-color .15s,box-shadow .15s,transform .15s}.mirror::after{content:"";position:absolute;inset:0;background:linear-gradient(145deg,rgba(255,255,255,.08),transparent 36%);pointer-events:none}.mirror label{position:absolute;z-index:2;left:7px;top:5px;padding:2px 6px;border-radius:8px;background:rgba(3,5,8,.62);font-size:9px;color:#ccd5df}.mirror .watch{display:none;position:absolute;z-index:2;right:6px;top:5px;padding:2px 6px;border-radius:8px;background:rgba(255,198,77,.88);color:#251a00;font-size:9px;font-weight:800}.mirror.focus{border-color:#ffd35c;box-shadow:0 0 0 2px rgba(255,211,92,.18),0 8px 30px rgba(255,180,50,.2);transform:translateY(-2px)}.mirror.focus .watch{display:block}.mirror.hidden{display:none}.hud{position:fixed;z-index:8;left:10px;bottom:132px;display:grid;grid-template-columns:repeat(2,105px);gap:6px;pointer-events:none}.metric{padding:7px 9px;background:rgba(10,12,15,.72);border:1px solid rgba(255,255,255,.08);border-radius:12px}.metric label{display:block;font-size:9px;color:#8f99a8}.metric b{font-size:12px}.viewbar{position:fixed;z-index:9;right:10px;top:126px;display:grid;gap:6px}.viewbar button,.actions button,.drivepad button{border:1px solid rgba(255,255,255,.12);color:#fff;background:rgba(14,17,22,.84);border-radius:13px}.viewbar button{padding:7px 9px;font-size:10px}.on{background:rgba(79,129,255,.35)!important}.controls{position:fixed;z-index:10;left:0;right:0;bottom:0;padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:end;pointer-events:none}.drivepad,.actions{pointer-events:auto}.drivepad{display:grid;grid-template-columns:48px 58px 48px;grid-template-rows:44px 44px;gap:5px}.drivepad .left{grid-column:1;grid-row:2}.drivepad .forward{grid-column:2;grid-row:1}.drivepad .reverse{grid-column:2;grid-row:2}.drivepad .right{grid-column:3;grid-row:2}.drivepad button{font-size:11px;font-weight:700}.drivepad button.active{transform:scale(.96);background:rgba(90,134,255,.45)}.actions{display:grid;grid-template-columns:repeat(2,64px);gap:5px}.actions button{padding:7px 4px;font-size:10px}.hint{position:fixed;z-index:8;left:50%;bottom:5px;transform:translateX(-50%);font-size:9px;color:#95a0af;white-space:nowrap;pointer-events:none}@media(max-width:700px){.brand small{display:none}.coach{top:66px}.mirrors{top:106px;gap:5px}.mirror{width:31vw}.viewbar{top:116px}.hint{display:none}}@media(max-width:430px){.mirrors{top:104px}.mirror{width:34vw}.hud{bottom:128px;grid-template-columns:repeat(2,98px)}.drivepad{grid-template-columns:44px 54px 44px}.actions{grid-template-columns:repeat(2,60px)}}
</style>
</head>
<body>
<div id="app">
<canvas id="scene"></canvas>
<div class="topbar"><div class="panel brand"><b>驾驶实验室 · 倒车入库</b><small>v0.4 · 实时教练 + 双后视镜</small></div><div id="status" class="panel status ok"><strong>训练中 · R</strong><small>W 前进 · S 后退</small></div></div>
<div id="coach" class="panel coach ok"><b>教练</b><span>正在分析当前轨迹…</span></div>
<div id="mirrors" class="mirrors"><div id="mirror-left" class="mirror"><label>左后视镜</label><span class="watch">观察这里</span></div><div id="mirror-right" class="mirror"><label>右后视镜</label><span class="watch">观察这里</span></div></div>
<div class="viewbar"><button data-view="chase" class="on">跟车</button><button data-view="top">俯视</button><button data-view="driver">驾驶</button></div>
<div class="hud"><div class="metric"><label>挡位 / 速度</label><b id="speed">R · 0.0</b></div><div class="metric"><label>方向盘</label><b id="steer">回正 · 0°</b></div><div class="metric"><label>参考横向偏差</label><b id="deviation">--</b></div><div class="metric"><label>预测触线</label><b id="risk">--</b></div></div>
<div class="controls"><div class="drivepad"><button class="left" data-control="left">A<br>左打</button><button class="forward" data-control="forward">W<br>前进</button><button class="reverse" data-control="reverse">S<br>后退</button><button class="right" data-control="right">D<br>右打</button></div><div class="actions"><button id="center">Space 回正</button><button id="trace" class="on">轮迹 ON</button><button id="predict" class="on">预测 ON</button><button id="sweep" class="on">扫掠 ON</button><button id="mirrors-toggle" class="on">后视镜 ON</button><button id="ghost">参考轨迹</button><button id="reset">重置</button></div></div>
<div class="hint">W 前进 · S 后退 · A/D 打方向并保持 · Space 回正 · R 重置 · M 后视镜</div>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js';
import {VEHICLE,COURSE,CONTROL_BINDINGS,INITIAL_STATE,cloneState,localToWorld,wheelPoints,stepVehicle,ackermannAngles,steeringWheelDegrees,lineViolation,parkingSuccess,predictStates,referenceTrajectory} from './physics.mjs';
import {coachHint,predictedSweepSamples} from './coach.mjs';
const canvas=document.querySelector('#scene');const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.autoClear=true;const scene=new THREE.Scene();scene.background=new THREE.Color(0x11161a);scene.fog=new THREE.Fog(0x11161a,24,58);const camera=new THREE.PerspectiveCamera(58,1,.05,100);const mirrorCameras={left:new THREE.PerspectiveCamera(48,2.15,.05,45),right:new THREE.PerspectiveCamera(48,2.15,.05,45)};scene.add(new THREE.HemisphereLight(0xc6ddff,0x29321f,2.15));const sun=new THREE.DirectionalLight(0xffffff,2.3);sun.position.set(8,15,6);sun.castShadow=true;scene.add(sun);const ground=new THREE.Mesh(new THREE.PlaneGeometry(52,52),new THREE.MeshStandardMaterial({color:0x30373a,roughness:.96}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);const grid=new THREE.GridHelper(42,42,0x475055,0x3a4246);grid.material.opacity=.22;grid.material.transparent=true;grid.position.y=.012;scene.add(grid);
const lineMat=new THREE.MeshBasicMaterial({color:0xf1e8c5});function stripe(x,z,w,d,mat=lineMat){const m=new THREE.Mesh(new THREE.BoxGeometry(w,.018,d),mat);m.position.set(x,.026,z);scene.add(m)}const sideZ=(COURSE.openingZ+COURSE.backZ)/2;stripe(-COURSE.bayWidth/2,sideZ,COURSE.lineWidth,COURSE.bayDepth);stripe(COURSE.bayWidth/2,sideZ,COURSE.lineWidth,COURSE.bayDepth);stripe(0,COURSE.backZ,COURSE.bayWidth+COURSE.lineWidth,COURSE.lineWidth);for(const x of[-3.75,3.75]){stripe(x-COURSE.bayWidth/2,sideZ,.055,COURSE.bayDepth);stripe(x+COURSE.bayWidth/2,sideZ,.055,COURSE.bayDepth);stripe(x,COURSE.backZ,COURSE.bayWidth,.055)}for(const [x,z] of [[-6,1.7],[6,1.7],[-6,4.7],[6,4.7]]){const c=new THREE.Mesh(new THREE.ConeGeometry(.13,.38,16),new THREE.MeshStandardMaterial({color:0xff8b45,roughness:.8}));c.position.set(x,.19,z);scene.add(c)}
const car=new THREE.Group();scene.add(car);const frontZ=-(VEHICLE.wheelbase+VEHICLE.frontOverhang),rearZ=VEHICLE.rearOverhang,bodyCenterZ=(frontZ+rearZ)/2;const body=new THREE.Mesh(new THREE.BoxGeometry(VEHICLE.width,.48,VEHICLE.length),new THREE.MeshStandardMaterial({color:0xced8e5,metalness:.3,roughness:.4}));body.position.set(0,.52,bodyCenterZ);body.castShadow=true;car.add(body);const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.52,.55,2.2),new THREE.MeshStandardMaterial({color:0x7f99ad,transparent:true,opacity:.9}));cabin.position.set(0,.98,-1.35);car.add(cabin);const wheelGeo=new THREE.CylinderGeometry(VEHICLE.wheelRadius,VEHICLE.wheelRadius,VEHICLE.wheelWidth,20);wheelGeo.rotateZ(Math.PI/2);const wheelMat=new THREE.MeshStandardMaterial({color:0x101214}),wheels={};for(const[n,x,z]of[['fl',-VEHICLE.trackWidth/2,-VEHICLE.wheelbase],['fr',VEHICLE.trackWidth/2,-VEHICLE.wheelbase],['rl',-VEHICLE.trackWidth/2,0],['rr',VEHICLE.trackWidth/2,0]]){const p=new THREE.Group();p.position.set(x,VEHICLE.wheelRadius,z);car.add(p);const w=new THREE.Mesh(wheelGeo,wheelMat);p.add(w);wheels[n]={pivot:p,w}}
const traceGroup=new THREE.Group(),predictionGroup=new THREE.Group(),ghostGroup=new THREE.Group(),sweepGroup=new THREE.Group();scene.add(traceGroup,predictionGroup,ghostGroup,sweepGroup);ghostGroup.visible=false;const tracePts={fl:[],fr:[],rl:[],rr:[]};function v3(p,y=.05){return new THREE.Vector3(p.x,y,p.z)}function rebuildTrace(){traceGroup.clear();for(const k in tracePts){if(tracePts[k].length<2)continue;traceGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(tracePts[k].map(p=>v3(p))),new THREE.LineBasicMaterial({color:k[0]==='r'?0x72dca5:0x7fb6ff,transparent:true,opacity:k[0]==='r'?.9:.45})))}}function sampleTrace(s){const pts=wheelPoints(s);if(!tracePts.rl.length||Math.hypot(pts.rl.x-tracePts.rl.at(-1).x,pts.rl.z-tracePts.rl.at(-1).z)>.055){for(const k in tracePts){tracePts[k].push({...pts[k]});if(tracePts[k].length>800)tracePts[k].shift()}rebuildTrace()}}
let predictOn=true,sweepOn=true,mirrorsOn=true;function updatePrediction(s){predictionGroup.clear();if(!predictOn)return;const paths={fl:[],fr:[],rl:[],rr:[]};for(const pose of predictStates(s,{distance:4.6,samples:70})){const p=wheelPoints(pose);for(const k in paths)paths[k].push(v3(p[k],.06))}for(const k in paths)predictionGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(paths[k]),new THREE.LineBasicMaterial({color:k[0]==='r'?0x72dca5:0x7fb6ff,transparent:true,opacity:k[0]==='r'?.62:.25})))}function updateSweep(s){sweepGroup.clear();if(!sweepOn)return;const samples=predictedSweepSamples(s,{distance:4.6,samples:30});for(let i=2;i<samples.length;i+=3){const poly=samples[i].polygon,shape=new THREE.Shape();shape.moveTo(poly[0].x,poly[0].z);for(let j=1;j<poly.length;j++)shape.lineTo(poly[j].x,poly[j].z);shape.closePath();const g=new THREE.ShapeGeometry(shape);g.rotateX(Math.PI/2);const danger=lineViolation(samples[i].pose);const mesh=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:danger?0xff4f58:0x6fa8ff,transparent:true,opacity:danger?.11:.025,side:THREE.DoubleSide,depthWrite:false}));mesh.position.y=.035;sweepGroup.add(mesh)}}function buildReference(){const pts=referenceTrajectory().map(p=>v3(localToWorld(0,0,p),.055)),l=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineDashedMaterial({color:0xffd567,dashSize:.25,gapSize:.16}));l.computeLineDistances();ghostGroup.add(l)}buildReference();
let state=cloneState(INITIAL_STATE),controls={left:false,right:false,reverse:false,forward:false},view='chase',traceOn=true,centerPulse=false,lastHint=null;function reset(){state=cloneState(INITIAL_STATE);for(const k in tracePts)tracePts[k]=[];traceGroup.clear();for(const k in controls)controls[k]=false}function renderCar(dt){car.position.set(state.rearX,0,state.rearZ);car.rotation.y=state.yaw;const a=ackermannAngles(state.steer);wheels.fl.pivot.rotation.y=a.left;wheels.fr.pivot.rotation.y=a.right;for(const {w} of Object.values(wheels))w.rotation.x+=state.speed*dt/VEHICLE.wheelRadius}function updateCamera(dt){let target,look;if(view==='top'){target=new THREE.Vector3(state.rearX,15,state.rearZ+.7);look=new THREE.Vector3(state.rearX,0,state.rearZ-1)}else if(view==='driver'){const p=localToWorld(-.46,-1.05,state),f=localToWorld(-.46,-9,state);target=new THREE.Vector3(p.x,1.23,p.z);look=new THREE.Vector3(f.x,1.08,f.z)}else{const p=localToWorld(0,6.8,state);target=new THREE.Vector3(p.x,4.55,p.z);look=new THREE.Vector3(state.rearX,.55,state.rearZ)}camera.position.lerp(target,1-Math.exp(-dt*6.5));camera.lookAt(look)}function updateMirrorCamera(cam,side){const sx=side==='left'?-1.02:1.02;const pos=localToWorld(sx,-1.05,state),aim=localToWorld(side==='left'?-1.18:1.18,6.2,state);cam.position.set(pos.x,1.12,pos.z);cam.up.set(0,1,0);cam.lookAt(aim.x,.33,aim.z)}function renderMirrors(){if(!mirrorsOn)return;renderer.setScissorTest(true);for(const side of ['left','right']){const el=document.querySelector(`#mirror-${side}`),rect=el.getBoundingClientRect();if(rect.width<2||rect.height<2)continue;const cam=mirrorCameras[side];updateMirrorCamera(cam,side);cam.aspect=rect.width/rect.height;cam.updateProjectionMatrix();const x=rect.left,y=innerHeight-rect.bottom;renderer.setViewport(x,y,rect.width,rect.height);renderer.setScissor(x,y,rect.width,rect.height);renderer.render(scene,cam)}renderer.setScissorTest(false);renderer.setViewport(0,0,innerWidth,innerHeight)}function updateHud(){const sw=steeringWheelDegrees(state.steer),h=coachHint(state,{distance:4.6,samples:85});lastHint=h;document.querySelector('#steer').textContent=`${sw>3?'左':sw<-3?'右':'回正'} · ${Math.round(Math.abs(sw))}°`;document.querySelector('#speed').textContent=`${state.gear} · ${(Math.abs(state.speed)*3.6).toFixed(1)} km/h`;document.querySelector('#deviation').textContent=`${h.deviation.lateral>=0?'右':'左'} ${Math.abs(h.deviation.lateral).toFixed(2)} m`;document.querySelector('#risk').textContent=h.risk.willTouch?`${h.risk.distanceAhead.toFixed(1)} m 后`:'安全';const ce=document.querySelector('#coach');ce.className=`panel coach ${h.level}`;ce.innerHTML=`<b>教练</b><span>${h.text}</span>`;const focus=h.risk.innerRearWheel;document.querySelector('#mirror-left').classList.toggle('focus',mirrorsOn&&focus==='rl');document.querySelector('#mirror-right').classList.toggle('focus',mirrorsOn&&focus==='rr');const el=document.querySelector('#status');if(lineViolation(state)){el.className='panel status bad';el.innerHTML=`<strong>已触线 · ${state.gear}</strong><small>车身多边形检测</small>`}else if(parkingSuccess(state)){el.className='panel status warn';el.innerHTML='<strong>入库完成</strong><small>姿态与边界合格</small>'}else{el.className='panel status ok';el.innerHTML=`<strong>训练中 · ${state.gear}</strong><small>W 前进 · S 后退</small>`}}function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();const keyMap=CONTROL_BINDINGS;addEventListener('keydown',e=>{if(keyMap[e.code]){controls[keyMap[e.code]]=true;e.preventDefault()}if(e.code==='Space'){centerPulse=true;e.preventDefault()}if(e.code==='KeyR')reset();if(e.code==='KeyM')toggleMirrors();if(e.code==='Digit1')setView('chase');if(e.code==='Digit2')setView('top');if(e.code==='Digit3')setView('driver')});addEventListener('keyup',e=>{if(keyMap[e.code]){controls[keyMap[e.code]]=false;e.preventDefault()}});for(const btn of document.querySelectorAll('[data-control]')){const k=btn.dataset.control,on=e=>{e.preventDefault();controls[k]=true;btn.classList.add('active')},off=e=>{e.preventDefault();controls[k]=false;btn.classList.remove('active')};btn.addEventListener('pointerdown',on);btn.addEventListener('pointerup',off);btn.addEventListener('pointercancel',off);btn.addEventListener('pointerleave',off)}function setView(v){view=v;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('on',b.dataset.view===v))}document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));function toggleMirrors(){mirrorsOn=!mirrorsOn;document.querySelectorAll('.mirror').forEach(el=>el.classList.toggle('hidden',!mirrorsOn));const b=document.querySelector('#mirrors-toggle');b.classList.toggle('on',mirrorsOn);b.textContent=`后视镜 ${mirrorsOn?'ON':'OFF'}`}document.querySelector('#center').addEventListener('click',()=>centerPulse=true);document.querySelector('#reset').addEventListener('click',reset);document.querySelector('#trace').addEventListener('click',e=>{traceOn=!traceOn;traceGroup.visible=traceOn;e.currentTarget.classList.toggle('on',traceOn);e.currentTarget.textContent=`轮迹 ${traceOn?'ON':'OFF'}`});document.querySelector('#predict').addEventListener('click',e=>{predictOn=!predictOn;e.currentTarget.classList.toggle('on',predictOn);e.currentTarget.textContent=`预测 ${predictOn?'ON':'OFF'}`});document.querySelector('#sweep').addEventListener('click',e=>{sweepOn=!sweepOn;e.currentTarget.classList.toggle('on',sweepOn);e.currentTarget.textContent=`扫掠 ${sweepOn?'ON':'OFF'}`});document.querySelector('#mirrors-toggle').addEventListener('click',toggleMirrors);document.querySelector('#ghost').addEventListener('click',e=>{ghostGroup.visible=!ghostGroup.visible;e.currentTarget.classList.toggle('on',ghostGroup.visible)});let last=performance.now(),acc=0,lastAnalysis=0,frameNo=0;const fixed=1/120;function frame(now){requestAnimationFrame(frame);frameNo++;const dt=Math.min((now-last)/1000,.05);last=now;acc+=dt;while(acc>=fixed){state=stepVehicle(state,fixed,{...controls,centerSteering:centerPulse});centerPulse=false;if(traceOn&&Math.abs(state.speed)>.025)sampleTrace(state);acc-=fixed}renderCar(dt);updateCamera(dt);if(now-lastAnalysis>=50){updatePrediction(state);updateSweep(state);updateHud();lastAnalysis=now}renderer.setViewport(0,0,innerWidth,innerHeight);renderer.setScissorTest(false);renderer.render(scene,camera);if(innerWidth>=700||frameNo%2===0)renderMirrors()}requestAnimationFrame(frame);
</script>
