<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d10" />
  <meta name="description" content="Three.js 驾驶几何实验室：使用低速车辆运动学理解倒车入库、轮迹和转向。" />
  <title>驾驶实验室 · 倒车入库 v0.2</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#f7f8fa;background:#0b0d10;font-synthesis:none;text-rendering:optimizeLegibility}*{box-sizing:border-box}html,body,#app{width:100%;height:100%;margin:0;overflow:hidden}body{overscroll-behavior:none;touch-action:none}button{font:inherit}#scene{position:fixed;inset:0;width:100%;height:100%;display:block}.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at center,transparent 58%,rgba(0,0,0,.35) 100%)}.topbar{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start;pointer-events:none}.panel{pointer-events:auto;backdrop-filter:blur(16px);background:rgba(10,12,15,.74);border:1px solid rgba(255,255,255,.10);box-shadow:0 8px 30px rgba(0,0,0,.25);border-radius:16px}.brand{padding:10px 12px}.brand b{display:block;font-size:15px}.brand span{display:block;margin-top:3px;font-size:11px;color:#9aa4b2}.status{min-width:150px;padding:9px 11px;text-align:right}.status strong{display:block;font-size:13px}.status small{color:#9aa4b2;font-size:11px}.status.ok strong{color:#8af2af}.status.bad strong{color:#ff8c8c}.status.done strong{color:#ffd978}.hud{position:fixed;left:12px;bottom:calc(145px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(2,minmax(108px,1fr));gap:7px;pointer-events:none}.metric{padding:8px 10px;border-radius:13px;background:rgba(10,12,15,.70);border:1px solid rgba(255,255,255,.09);backdrop-filter:blur(14px)}.metric label{display:block;font-size:10px;color:#8f99a8;margin-bottom:2px}.metric b{font-size:13px;font-variant-numeric:tabular-nums}.viewbar{position:fixed;top:88px;right:12px;display:grid;gap:7px}.viewbar button,.actions button,.drivepad button{border:1px solid rgba(255,255,255,.12);color:#f8fafc;background:rgba(14,17,22,.82);backdrop-filter:blur(16px);box-shadow:0 6px 20px rgba(0,0,0,.18);border-radius:14px;-webkit-tap-highlight-color:transparent}.viewbar button{pointer-events:auto;padding:8px 10px;font-size:11px}.viewbar button.on,.actions button.on{background:rgba(79,129,255,.34);border-color:rgba(118,155,255,.55)}.controls{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:auto 1fr auto;align-items:end;gap:10px;pointer-events:none}.drivepad,.actions{pointer-events:auto}.drivepad{display:grid;grid-template-columns:58px 68px 58px;grid-template-rows:50px 50px;gap:6px}.drivepad button{font-size:12px;font-weight:700;white-space:pre-line}.drivepad .left{grid-column:1;grid-row:2}.drivepad .forward{grid-column:2;grid-row:1}.drivepad .reverse{grid-column:2;grid-row:2}.drivepad .right{grid-column:3;grid-row:2}.drivepad button.active{transform:scale(.96);background:rgba(90,134,255,.42)}.actions{justify-self:end;display:grid;grid-template-columns:repeat(2,minmax(76px,1fr));gap:6px}.actions button{padding:9px 10px;font-size:11px;font-weight:650}.hint{position:fixed;left:50%;bottom:calc(8px + env(safe-area-inset-bottom));transform:translateX(-50%);font-size:10px;color:#95a0af;pointer-events:none;white-space:nowrap}.legend{position:fixed;left:12px;top:92px;font-size:10px;color:#a7b0bc;padding:7px 9px}.legend i{display:inline-block;width:14px;height:2px;vertical-align:middle;margin:0 4px 2px 8px}.legend i:first-child{margin-left:0}.rear{background:#72dca5}.front{background:#7fb6ff}.ghost{background:#ffd567}@media(max-width:720px){.brand span{display:none}.status{min-width:126px}.hud{bottom:calc(138px + env(safe-area-inset-bottom));grid-template-columns:repeat(2,102px)}.legend{display:none}.drivepad{grid-template-columns:50px 62px 50px;grid-template-rows:46px 46px}.actions{grid-template-columns:repeat(2,70px)}.actions button{padding:8px 5px}.hint{display:none}}@media(max-width:420px){.topbar{left:8px;right:8px}.controls{padding-left:8px;padding-right:8px;gap:6px}.viewbar{right:8px}.drivepad{grid-template-columns:46px 58px 46px}.actions{grid-template-columns:repeat(2,64px)}.hud{left:8px;grid-template-columns:repeat(2,98px)}}
  </style>
</head>
<body>
<div id="app">
  <canvas id="scene"></canvas><div class="vignette"></div>
  <div class="topbar"><div class="panel brand"><b>驾驶实验室 · 倒车入库</b><span>v0.2 physics rewrite · 后轴中心运动学</span></div><div id="status" class="panel status ok"><strong>训练中 · R</strong><small>W 前进 · S 后退</small></div></div>
  <div class="panel legend"><i class="rear"></i>后轮轨迹 <i class="front"></i>前轮轨迹 <i class="ghost"></i>物理可行参考轨迹</div>
  <div class="viewbar"><button data-view="chase" class="on">跟车</button><button data-view="top">俯视</button><button data-view="driver">驾驶</button></div>
  <div class="hud"><div class="metric"><label>挡位 / 速度</label><b id="speed">R · 0.0 km/h</b></div><div class="metric"><label>方向盘</label><b id="steer">回正 · 0°</b></div><div class="metric"><label>等效前轮角</label><b id="roadwheel">0.0°</b></div><div class="metric"><label>后轴到库位中心</label><b id="distance">--</b></div></div>
  <div class="controls">
    <div class="drivepad"><button class="left" data-control="left">A<br>左打</button><button class="forward" data-control="forward">W<br>前进</button><button class="reverse" data-control="reverse">S<br>后退</button><button class="right" data-control="right">D<br>右打</button></div>
    <div></div>
    <div class="actions"><button id="center">Space 回正</button><button id="trace" class="on">轮迹 ON</button><button id="predict" class="on">预测 ON</button><button id="ghost">参考轨迹</button><button id="reset">重新开始</button><button id="physics">物理 v0.2</button></div>
  </div>
  <div class="hint">W 前进 · S 后退 · A/D 打方向并保持 · Space 主动回正 · R 重置 · 1/2/3 视角</div>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js';
import {
  VEHICLE, COURSE, CONTROL_BINDINGS, INITIAL_STATE, cloneState, localToWorld, wheelPoints, bodyPolygon,
  stepVehicle, ackermannAngles, steeringWheelDegrees, lineViolation, parkingSuccess,
  predictStates, referenceTrajectory,
} from './physics.mjs';

const canvas=document.querySelector('#scene');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.03;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x11161a);scene.fog=new THREE.Fog(0x11161a,24,58);
const camera=new THREE.PerspectiveCamera(58,1,.05,100);
scene.add(new THREE.HemisphereLight(0xc6ddff,0x29321f,2.15));
const sun=new THREE.DirectionalLight(0xffffff,2.35);sun.position.set(8,15,6);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-20;sun.shadow.camera.right=20;sun.shadow.camera.top=20;sun.shadow.camera.bottom=-20;scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(52,52),new THREE.MeshStandardMaterial({color:0x30373a,roughness:.96}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const grid=new THREE.GridHelper(42,42,0x475055,0x3a4246);grid.material.opacity=.22;grid.material.transparent=true;grid.position.y=.012;scene.add(grid);

const course=new THREE.Group();scene.add(course);const lineMat=new THREE.MeshBasicMaterial({color:0xf1e8c5});
function stripe(x,z,w,d,mat=lineMat){const m=new THREE.Mesh(new THREE.BoxGeometry(w,.018,d),mat);m.position.set(x,.026,z);course.add(m);return m}
const sideCenterZ=(COURSE.openingZ+COURSE.backZ)/2;
stripe(-COURSE.bayWidth/2,sideCenterZ,COURSE.lineWidth,COURSE.bayDepth);stripe(COURSE.bayWidth/2,sideCenterZ,COURSE.lineWidth,COURSE.bayDepth);stripe(0,COURSE.backZ,COURSE.bayWidth+COURSE.lineWidth,COURSE.lineWidth);
for(const x of[-3.75,3.75]){stripe(x-COURSE.bayWidth/2,sideCenterZ,.055,COURSE.bayDepth);stripe(x+COURSE.bayWidth/2,sideCenterZ,.055,COURSE.bayDepth);stripe(x,COURSE.backZ,COURSE.bayWidth,.055)}
stripe(0,3.2,16,.055,new THREE.MeshBasicMaterial({color:0xd6dce0,transparent:true,opacity:.32}));
const coneGeo=new THREE.ConeGeometry(.13,.38,18),coneMat=new THREE.MeshStandardMaterial({color:0xff8b45,roughness:.8});for(const[x,z]of[[-6,1.7],[6,1.7],[-6,4.7],[6,4.7]]){const c=new THREE.Mesh(coneGeo,coneMat);c.position.set(x,.19,z);c.castShadow=true;scene.add(c)}

const car=new THREE.Group();scene.add(car);
const frontZ=-(VEHICLE.wheelbase+VEHICLE.frontOverhang),rearZ=VEHICLE.rearOverhang,bodyCenterZ=(frontZ+rearZ)/2;
const body=new THREE.Mesh(new THREE.BoxGeometry(VEHICLE.width,.48,VEHICLE.length),new THREE.MeshStandardMaterial({color:0xced8e5,metalness:.32,roughness:.4}));body.position.set(0,.52,bodyCenterZ);body.castShadow=true;car.add(body);
const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.52,.55,2.20),new THREE.MeshStandardMaterial({color:0x7f99ad,metalness:.12,roughness:.27,transparent:true,opacity:.9}));cabin.position.set(0,.98,-1.35);cabin.castShadow=true;car.add(cabin);
const hood=new THREE.Mesh(new THREE.BoxGeometry(1.66,.12,1.05),new THREE.MeshStandardMaterial({color:0xd9e2ec,metalness:.32,roughness:.4}));hood.position.set(0,.81,frontZ+.58);car.add(hood);
const bumperMat=new THREE.MeshStandardMaterial({color:0x1d2328,roughness:.7});for(const z of[frontZ+.08,rearZ-.08]){const b=new THREE.Mesh(new THREE.BoxGeometry(1.70,.15,.12),bumperMat);b.position.set(0,.42,z);car.add(b)}
const wheelGeo=new THREE.CylinderGeometry(VEHICLE.wheelRadius,VEHICLE.wheelRadius,VEHICLE.wheelWidth,22);wheelGeo.rotateZ(Math.PI/2);const wheelMat=new THREE.MeshStandardMaterial({color:0x101214,roughness:.84}),wheels={};
for(const[name,x,z]of[['fl',-VEHICLE.trackWidth/2,-VEHICLE.wheelbase],['fr',VEHICLE.trackWidth/2,-VEHICLE.wheelbase],['rl',-VEHICLE.trackWidth/2,0],['rr',VEHICLE.trackWidth/2,0]]){const pivot=new THREE.Group();pivot.position.set(x,VEHICLE.wheelRadius,z);car.add(pivot);const w=new THREE.Mesh(wheelGeo,wheelMat);w.castShadow=true;pivot.add(w);wheels[name]={pivot,w}}
for(const x of[-.62,.62]){const h=new THREE.Mesh(new THREE.BoxGeometry(.32,.10,.05),new THREE.MeshBasicMaterial({color:0xf7f3cf}));h.position.set(x,.58,frontZ-.026);car.add(h);const t=new THREE.Mesh(new THREE.BoxGeometry(.32,.12,.05),new THREE.MeshBasicMaterial({color:0xff4f58}));t.position.set(x,.58,rearZ+.026);car.add(t)}

const traceGroup=new THREE.Group(),predictionGroup=new THREE.Group(),ghostGroup=new THREE.Group();scene.add(traceGroup,predictionGroup,ghostGroup);ghostGroup.visible=false;
const tracePts={fl:[],fr:[],rl:[],rr:[]},traceLines={};
const traceStyle={rl:[0x72dca5,.92],rr:[0x72dca5,.92],fl:[0x7fb6ff,.48],fr:[0x7fb6ff,.48]};
function threePoint(p,y=.05){return new THREE.Vector3(p.x,y,p.z)}
function rebuildTrace(){traceGroup.clear();for(const k of Object.keys(tracePts)){if(tracePts[k].length<2)continue;const [color,opacity]=traceStyle[k];const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints(tracePts[k].map(p=>threePoint(p))),new THREE.LineBasicMaterial({color,transparent:true,opacity}));traceGroup.add(line);traceLines[k]=line}}
function sampleTrace(s){const pts=wheelPoints(s);if(!tracePts.rl.length||Math.hypot(pts.rl.x-tracePts.rl.at(-1).x,pts.rl.z-tracePts.rl.at(-1).z)>.055){for(const k of Object.keys(tracePts)){tracePts[k].push({...pts[k]});if(tracePts[k].length>900)tracePts[k].shift()}rebuildTrace()}}
function updatePrediction(s){predictionGroup.clear();if(!predictOn)return;const predicted=predictStates(s,{distance:4.6,samples:85});const paths={fl:[],fr:[],rl:[],rr:[]};for(const pose of predicted){const pts=wheelPoints(pose);for(const k of Object.keys(paths))paths[k].push(threePoint(pts[k],.06))}for(const k of Object.keys(paths)){const rear=k[0]==='r';const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints(paths[k]),new THREE.LineBasicMaterial({color:rear?0x72dca5:0x7fb6ff,transparent:true,opacity:rear?.66:.28}));predictionGroup.add(line)}}
function buildReference(){ghostGroup.clear();const ref=referenceTrajectory();const rear=[],bodyCenter=[];for(const pose of ref){const rp=localToWorld(0,0,pose);const cp=localToWorld(0,bodyCenterZ,pose);rear.push(threePoint(rp,.055));bodyCenter.push(threePoint(cp,.055))}for(const[pts,opacity]of[[rear,.88],[bodyCenter,.34]]){const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineDashedMaterial({color:0xffd567,dashSize:.26,gapSize:.16,transparent:true,opacity}));l.computeLineDistances();ghostGroup.add(l)}}buildReference();

let state=cloneState(INITIAL_STATE);const controls={left:false,right:false,reverse:false,forward:false};let view='chase',traceOn=true,predictOn=true,centerPulse=false;
function reset(){state=cloneState(INITIAL_STATE);for(const k of Object.keys(tracePts))tracePts[k]=[];traceGroup.clear();controls.left=controls.right=controls.reverse=controls.forward=false;document.querySelectorAll('[data-control]').forEach(b=>b.classList.remove('active'))}reset();

function renderCar(dt){car.position.set(state.rearX,0,state.rearZ);car.rotation.y=state.yaw;const ack=ackermannAngles(state.steer);wheels.fl.pivot.rotation.y=ack.left;wheels.fr.pivot.rotation.y=ack.right;for(const {w} of Object.values(wheels))w.rotation.x+=state.speed*dt/VEHICLE.wheelRadius}
function updateCamera(dt){const rear=new THREE.Vector3(state.rearX,.55,state.rearZ);let target,look;if(view==='top'){target=new THREE.Vector3(state.rearX,15,state.rearZ+.7);look=new THREE.Vector3(state.rearX,0,state.rearZ-1)}else if(view==='driver'){const p=localToWorld(-.46,-1.05,state),f=localToWorld(-.46,-9,state);target=new THREE.Vector3(p.x,1.23,p.z);look=new THREE.Vector3(f.x,1.08,f.z)}else{const p=localToWorld(0,6.8,state);target=new THREE.Vector3(p.x,4.55,p.z);look=rear}camera.position.lerp(target,1-Math.exp(-dt*6.5));camera.lookAt(look)}
function updateHud(){const sw=steeringWheelDegrees(state.steer),side=sw>3?'左':sw<-3?'右':'回正';document.querySelector('#steer').textContent=`${side} · ${Math.round(Math.abs(sw))}°`;document.querySelector('#roadwheel').textContent=`${(state.steer*180/Math.PI).toFixed(1)}°`;document.querySelector('#speed').textContent=`${state.gear} · ${(Math.abs(state.speed)*3.6).toFixed(1)} km/h`;const d=Math.hypot(state.rearX-COURSE.centerX,state.rearZ-COURSE.centerZ);document.querySelector('#distance').textContent=`${d.toFixed(1)} m`;const el=document.querySelector('#status');if(lineViolation(state)){el.className='panel status bad';el.innerHTML=`<strong>触线 / 越线 · ${state.gear}</strong><small>检测整个车身多边形，不只看四角</small>`}else if(parkingSuccess(state)){el.className='panel status done';el.innerHTML='<strong>入库完成</strong><small>车身完全在线内且姿态合格</small>'}else{el.className='panel status ok';el.innerHTML=`<strong>训练中 · ${state.gear}</strong><small>W 前进 · S 后退 · 松开 A/D 保持方向</small>`}}
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();

const keyMap=CONTROL_BINDINGS;
addEventListener('keydown',e=>{if(keyMap[e.code]){controls[keyMap[e.code]]=true;e.preventDefault()}if(e.code==='Space'){centerPulse=true;e.preventDefault()}if(e.code==='KeyR')reset();if(e.code==='Digit1')setView('chase');if(e.code==='Digit2')setView('top');if(e.code==='Digit3')setView('driver')});
addEventListener('keyup',e=>{if(keyMap[e.code]){controls[keyMap[e.code]]=false;e.preventDefault()}});
for(const btn of document.querySelectorAll('[data-control]')){const k=btn.dataset.control;const on=e=>{e.preventDefault();controls[k]=true;btn.classList.add('active')},off=e=>{e.preventDefault();controls[k]=false;btn.classList.remove('active')};btn.addEventListener('pointerdown',on);btn.addEventListener('pointerup',off);btn.addEventListener('pointercancel',off);btn.addEventListener('pointerleave',off)}
function setView(v){view=v;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('on',b.dataset.view===v))}document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
document.querySelector('#center').addEventListener('click',()=>centerPulse=true);document.querySelector('#reset').addEventListener('click',reset);document.querySelector('#trace').addEventListener('click',e=>{traceOn=!traceOn;traceGroup.visible=traceOn;e.currentTarget.classList.toggle('on',traceOn);e.currentTarget.textContent=`轮迹 ${traceOn?'ON':'OFF'}`});document.querySelector('#predict').addEventListener('click',e=>{predictOn=!predictOn;e.currentTarget.classList.toggle('on',predictOn);e.currentTarget.textContent=`预测 ${predictOn?'ON':'OFF'}`});document.querySelector('#ghost').addEventListener('click',e=>{ghostGroup.visible=!ghostGroup.visible;e.currentTarget.classList.toggle('on',ghostGroup.visible)});document.querySelector('#physics').addEventListener('click',()=>alert('v0.2：状态点=后轴中心；精确圆弧积分；W=前进/S=后退；Ackermann 前轮显示；方向盘松手保持；SAT 车身压线检测；预测和参考轨迹与主运动模型共用同一套方程。'));

let last=performance.now(),acc=0;const fixed=1/120;function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000,.05);last=now;acc+=dt;while(acc>=fixed){state=stepVehicle(state,fixed,{...controls,centerSteering:centerPulse});centerPulse=false;if(traceOn&&Math.abs(state.speed)>.025)sampleTrace(state);acc-=fixed}renderCar(dt);updatePrediction(state);updateCamera(dt);updateHud();renderer.render(scene,camera)}requestAnimationFrame(frame);
</script>
</body></html>
