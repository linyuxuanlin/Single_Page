const app=document.querySelector('#app');app.innerHTML=`<canvas id="scene"></canvas><div class="vignette"></div><div class="topbar"><div class="brand"><b>驾驶实验室 · 倒车入库</b><span>v0.1 · 看懂车辆轨迹，而不是只背点位</span></div><div id="status" class="status ok"><strong>训练中</strong><small>保持低速，观察后轮轨迹</small></div></div><div class="viewbar"><button data-view="chase" class="on">跟车</button><button data-view="top">俯视</button><button data-view="driver">驾驶</button></div><div class="hud"><div class="metric"><label>方向盘</label><b id="steer">0°</b></div><div class="metric"><label>速度</label><b id="speed">0.0 km/h</b></div><div class="metric"><label>后轮到库位中心</label><b id="distance">--</b></div></div><div class="controls"><div class="pad"><button class="up" data-key="up">↑</button><button class="left" data-key="left">←</button><button class="down" data-key="down">↓</button><button class="right" data-key="right">→</button></div><div></div><div class="actions"><button id="trace" class="on">轮迹 ON</button><button id="predict" class="on">预测 ON</button><button id="ghost">辅助线</button><button id="reset">重新开始</button></div></div><div class="help">W/S 前进后退 · A/D 打方向 · Space 回正 · R 重置 · 1/2/3 切换视角</div>`;
const canvas=document.querySelector('#scene'),renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;const scene=new THREE.Scene();scene.background=new THREE.Color(0x11161a);scene.fog=new THREE.Fog(0x11161a,22,55);const camera=new THREE.PerspectiveCamera(58,1,.05,100);scene.add(new THREE.HemisphereLight(0xc6ddff,0x29321f,2.1));const sun=new THREE.DirectionalLight(0xffffff,2.4);sun.position.set(7,14,5);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-18;sun.shadow.camera.right=18;sun.shadow.camera.top=18;sun.shadow.camera.bottom=-18;scene.add(sun);const ground=new THREE.Mesh(new THREE.PlaneGeometry(50,50),new THREE.MeshStandardMaterial({color:0x30373a,roughness:.95}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);const grid=new THREE.GridHelper(40,40,0x475055,0x3a4246);grid.material.opacity=.23;grid.material.transparent=true;grid.position.y=.012;scene.add(grid);
const course=new THREE.Group();scene.add(course);const lineMat=new THREE.MeshBasicMaterial({color:0xf2e8bd});function stripe(x,z,w,d,mat=lineMat){const m=new THREE.Mesh(new THREE.BoxGeometry(w,.018,d),mat);m.position.set(x,.025,z);course.add(m);return m}const BAY_W=2.5,BAY_D=5.2,bayCenter=new THREE.Vector3(0,0,-2.8);stripe(-BAY_W/2,-2.8,.08,BAY_D);stripe(BAY_W/2,-2.8,.08,BAY_D);stripe(0,-5.4,BAY_W+.08,.08);for(const x of[-3.75,3.75]){stripe(x-BAY_W/2,-2.8,.06,BAY_D);stripe(x+BAY_W/2,-2.8,.06,BAY_D);stripe(x,-5.4,BAY_W,.06)}stripe(0,3.1,16,.06,new THREE.MeshBasicMaterial({color:0xd6dce0,transparent:true,opacity:.35}));const coneGeo=new THREE.ConeGeometry(.13,.38,18),coneMat=new THREE.MeshStandardMaterial({color:0xff8b45,roughness:.8});for(const[x,z]of[[-6,1.7],[6,1.7],[-6,4.5],[6,4.5]]){const c=new THREE.Mesh(coneGeo,coneMat);c.position.set(x,.19,z);c.castShadow=true;scene.add(c)}

const state={x:4.7,z:3.3,yaw:Math.PI/2,speed:0,steer:0},keys={up:false,down:false,left:false,right:false};let view='chase',traceOn=true,predictOn=true;function reset(){Object.assign(state,{x:4.7,z:3.3,yaw:Math.PI/2,speed:0,steer:0});traceL=[];traceR=[];traceGroup.clear();traceLineL=traceLineR=null}reset();const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function worldFromLocal(lx,lz,s=state){const c=Math.cos(s.yaw),si=Math.sin(s.yaw);return new THREE.Vector3(s.x+lx*c+lz*si,0,s.z-lx*si+lz*c)}function vehicleCorners(s=state){const hw=CAR_W/2,hl=CAR_L/2;return[[-hw,-hl],[hw,-hl],[hw,hl],[-hw,hl]].map(([x,z])=>worldFromLocal(x,z,s))}function pointToSegmentDistance(px,pz,ax,az,bx,bz){const vx=bx-ax,vz=bz-az,wx=px-ax,wz=pz-az,c1=vx*wx+vz*wz,c2=vx*vx+vz*vz,t=c2?clamp(c1/c2,0,1):0,dx=px-(ax+t*vx),dz=pz-(az+t*vz);return Math.hypot(dx,dz)}function lineViolation(){const corners=vehicleCorners(),lines=[[-BAY_W/2,-5.4,-BAY_W/2,-.2],[BAY_W/2,-5.4,BAY_W/2,-.2],[-BAY_W/2,-5.4,BAY_W/2,-5.4]];for(const p of corners)for(const[ax,az,bx,bz]of lines)if(pointToSegmentDistance(p.x,p.z,ax,az,bx,bz)<.065)return true;return false}
function step(dt){const maxSteer=.56,steerRate=1.05;if(keys.left)state.steer=clamp(state.steer+steerRate*dt,-maxSteer,maxSteer);else if(keys.right)state.steer=clamp(state.steer-steerRate*dt,-maxSteer,maxSteer);else state.steer*=Math.pow(.985,dt*60);const target=keys.up?1.35:keys.down?-1.15:0,accel=target===0?2.4:1.9;state.speed+=clamp(target-state.speed,-accel*dt,accel*dt);if(Math.abs(state.speed)<.004)state.speed=0;state.yaw+=state.speed/WHEELBASE*Math.tan(state.steer)*dt;state.x+=Math.sin(state.yaw)*state.speed*dt;state.z+=-Math.cos(state.yaw)*state.speed*dt;state.x=clamp(state.x,-10,10);state.z=clamp(state.z,-8,8);wheels.fl.pivot.rotation.y=-state.steer;wheels.fr.pivot.rotation.y=-state.steer;for(const{w}of Object.values(wheels))w.rotation.x+=state.speed*dt/.31;if(traceOn&&Math.abs(state.speed)>.03){const l=worldFromLocal(-CAR_W*.42,axleZ),r=worldFromLocal(CAR_W*.42,axleZ);if(!traceL.length||traceL.at(-1).distanceTo(l)>.055){traceL.push(l);traceR.push(r);if(traceL.length>900){traceL.shift();traceR.shift()}updateTraceLines()}}}
function updatePrediction(){predictionGroup.clear();if(!predictOn)return;const sim={...state},left=[],right=[],center=[],simSpeed=Math.abs(state.speed)>.08?state.speed:-.75;for(let i=0;i<85;i++){const dt=.055;sim.yaw+=simSpeed/WHEELBASE*Math.tan(sim.steer)*dt;sim.x+=Math.sin(sim.yaw)*simSpeed*dt;sim.z+=-Math.cos(sim.yaw)*simSpeed*dt;left.push(worldFromLocal(-CAR_W*.42,axleZ,sim));right.push(worldFromLocal(CAR_W*.42,axleZ,sim));center.push(new THREE.Vector3(sim.x,.035,sim.z))}const mk=(pts,color,opacity=.68)=>{const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color,transparent:true,opacity}));line.position.y=.035;predictionGroup.add(line)};mk(left,0x66e0a3);mk(right,0x6aaeff);mk(center,0xffffff,.22)}function updateCamera(dt){const carPos=new THREE.Vector3(state.x,.6,state.z);let targetPos,look;if(view==='top'){targetPos=new THREE.Vector3(state.x,14.5,state.z+1.5);look=new THREE.Vector3(state.x,0,state.z-.5)}else if(view==='driver'){const pos=worldFromLocal(-.46,-.55);targetPos=new THREE.Vector3(pos.x,1.2,pos.z);const f=worldFromLocal(-.46,-5);look=new THREE.Vector3(f.x,1,f.z)}else{const p=worldFromLocal(0,6.7);targetPos=new THREE.Vector3(p.x,4.5,p.z);look=carPos}camera.position.lerp(targetPos,1-Math.exp(-dt*6.5));camera.lookAt(look)}function renderCar(){car.position.set(state.x,0,state.z);car.rotation.y=state.yaw}function updateHud(){document.querySelector('#steer').textContent=`${Math.round(state.steer/.56*540)}°`;document.querySelector('#speed').textContent=`${(Math.abs(state.speed)*3.6).toFixed(1)} km/h`;const rear=worldFromLocal(0,axleZ);document.querySelector('#distance').textContent=`${rear.distanceTo(bayCenter).toFixed(1)} m`;const status=document.querySelector('#status');if(lineViolation()){status.className='status bad';status.innerHTML='<strong>压线</strong><small>观察四角与后轮轨迹</small>'}else{status.className='status ok';status.innerHTML='<strong>训练中</strong><small>保持低速，观察后轮轨迹</small>'}}function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();
const map={KeyW:'up',ArrowUp:'up',KeyS:'down',ArrowDown:'down',KeyA:'left',ArrowLeft:'left',KeyD:'right',ArrowRight:'right'};addEventListener('keydown',e=>{if(map[e.code]){keys[map[e.code]]=true;e.preventDefault()}if(e.code==='Space'){state.steer=0;e.preventDefault()}if(e.code==='KeyR')reset();if(e.code==='Digit1')setView('chase');if(e.code==='Digit2')setView('top');if(e.code==='Digit3')setView('driver')});addEventListener('keyup',e=>{if(map[e.code]){keys[map[e.code]]=false;e.preventDefault()}});for(const btn of document.querySelectorAll('[data-key]')){const k=btn.dataset.key,on=e=>{e.preventDefault();keys[k]=true;btn.classList.add('active')},off=e=>{e.preventDefault();keys[k]=false;btn.classList.remove('active')};btn.addEventListener('pointerdown',on);btn.addEventListener('pointerup',off);btn.addEventListener('pointercancel',off);btn.addEventListener('pointerleave',off)}function setView(v){view=v;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('on',b.dataset.view===v))}document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));document.querySelector('#reset').addEventListener('click',reset);document.querySelector('#trace').addEventListener('click',e=>{traceOn=!traceOn;traceGroup.visible=traceOn;e.currentTarget.classList.toggle('on',traceOn);e.currentTarget.textContent=`轮迹 ${traceOn?'ON':'OFF'}`});document.querySelector('#predict').addEventListener('click',e=>{predictOn=!predictOn;e.currentTarget.classList.toggle('on',predictOn);e.currentTarget.textContent=`预测 ${predictOn?'ON':'OFF'}`});document.querySelector('#ghost').addEventListener('click',e=>{ghostGroup.visible=!ghostGroup.visible;e.currentTarget.classList.toggle('on',ghostGroup.visible)});let last=performance.now(),acc=0;function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000,.05);last=now;acc+=dt;while(acc>=1/120){step(1/120);acc-=1/120}renderCar();updatePrediction();updateCamera(dt);updateHud();renderer.render
